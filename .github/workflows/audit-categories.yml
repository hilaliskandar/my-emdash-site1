name: Auditoria de classificacao editorial

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar credenciais
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Consultar D1 (somente leitura)
        run: |
          npx --yes wrangler@4.125.0 d1 execute radares-emdash-db-teste --remote --json --file scripts/audit-categories.sql > audit.json
      - name: Verificar todas as classificacoes
        run: node scripts/audit-categories.mjs --input audit.json
